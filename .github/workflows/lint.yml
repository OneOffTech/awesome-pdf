name: Lint

on:
  push:
    paths:
      - '**.md'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check readme follow conventions
      run: npx awesome-lint@2.3.0 ./README.md

    
